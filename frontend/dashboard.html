<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h2 class="taskflow">TaskFlow</h2>
      <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="login.html">logout</a>
      </nav>
    </header>
    <div class="dashboard-task">
      <div>
        <h1>Your Tasks</h1>
        <p>Overview Of  Your Tasks Here</p>
      </div>
      <div>
        <a href="login.html" class="new-task">Add a new task</a>

    <div class="task-overview">

          <p class="strong" style="color: blue;"><strong>8 </strong></p>
        </div>

          <p class="strong"  style="color: rgb(143, 143, 2)"><strong>2 </strong></p>
        </div>

    <div class = "task-list">
      <h3>Task List</h3>
      <ul>
        <li class="task-completed">Complete HTML Assigment</li>
        <li>Read JavaSript notes</li>
        <li>Build Taskflow project</li>
