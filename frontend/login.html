<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <!--<link rel="stylesheet" href="style.css">-->
    <link rel="stylesheet" href="./output.css">
  </head>
  <body  class="bg-blue-50">
    <header class="text-lg bg-green-500  md:bg-blue-300 block md:flex  md:justify-between md:items-center h-35 md:h-16 px-4 pt-2 md:pt-0 mx-2 md:mx-4 mt-2 mb-4 w-[25%] md:w-full rounded-lg shadow shadow-black">
      <h2 class="text-[blue] font-bold">TaskFlow</h2>
      <nav class="block md:flex md:gap-8 font-medium">
        <a href="index.html">Home</a>
        <a href="login.html" class="underline decoration-4 underline-offset-6 font-medium text-[white] md:text-[blue]">Login</a>
        <a href="signup.html">Sign Up</a>
      </nav>
    </header>
    
    <form action="" class=" block bg-white w-[70%] md:w-[40%] p-5 m-auto h:-[425px] md:h-[420px] shadow shadow-black rounded-2xl mb-4">
      <h2 class="text-center text-2xl font-bold mb-2">Login To Taskflow</h2>
      <p class="text-center mb-3">Welcome Back, Please enter your details</p>
      <label for="email" class="block font-bold mb-1">Email</label>
      <input type="email" id="email"  class="border w-full h-12 rounded-lg mb-2" />
      <label for="password" class="block font-bold mb-1">Password</label>
      <input type="password" id="password"  class="border w-full h-12 rounded-lg mb-2" />
      <label for="" class="block font-bold mb-3"> <input type="checkbox" /> Remember me </label>
      <input type="submit" value="Login" class="w-full h-12 bg-blue-700 text-white font-bold rounded-lg cursor-pointer hover:bg-green-500"  />
      <p class="text-center mt-5">
        Don't have a taskflow account?
        <a href="signup.html" class="text-blue-600 font-bold">Signup</a>
      </p>
    </form>
  </body>
</html>
