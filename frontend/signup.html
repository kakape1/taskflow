<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
   <!--<link rel="stylesheet" href="style.css">-->
   <link rel="stylesheet" href="./output.css">
  </head>
  <body class="bg-blue-50">
    <header class="text-lg bg-green-500  md:bg-blue-300 block md:flex  md:justify-between md:items-center h-35 md:h-16 px-4 pt-3 md:pt-0 mx-2 md:mx-4 mt-2 mb-4 md:mb-4 w-[25%] md:w-full rounded-lg shadow shadow-black">
      <h2 class="text-[blue] font-bold">TaskFlow</h2>
        <nav class="block md:flex md:gap-8 font-medium">
          <a href="index.html">Home</a>
          <a href="login.html">Login</a>
          <a href="signup.html" class="underline decoration-4 underline-offset-6 font-medium text-[white] md:text-[blue]">Signup</a>
        </nav>
    </header>
    
    
    <form action="" class=" block w-[70%] md:w-[40%] p-5 m-auto bg-white h-[480px] shadow shadow-black rounded-2xl mb-4 ">
      <h2 class="text-center text-2xl font-bold mb-2">Create Your Account</h2>
      <p class="text-center mb-3">Join The Team And Start Managing Your Task Today</p>
      <label for="name" class="block font-bold mb-1">Name</label>
      <input type="text" id="name" class="border w-full h-12 rounded-lg mb-2" />
      <label for="email" class="block font-bold mb-1">Email</label>
      <input type="email" id="email" class="border w-full h-12 rounded-lg mb-3"  />
      <label for="password" class="block font-bold mb-1">Password</label>
      <input type="password" id="password" class="border w-full h-12 rounded-lg mb-5" />
      <input type="submit" value="Create Account" class="w-full h-12 bg-blue-700 text-white font-bold rounded-lg cursor-pointer hover:bg-green-500" />
      <p class="text-center mt-3 md:mt-5">
        Already have an account?
        <a href="login.html" class="text-blue-600 font-bold">Login</a>
      </p>
    </form>
  </body>
</html>
